<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Aegis — a risk score on every GIWA contract, before you sign" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .bg{fill:#0F1729}
    .grid{stroke:#1c2742;stroke-width:1}
    .hex{fill:#2a3858;font:500 15px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px}
    .word{fill:#F4F7FB;font:700 92px 'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:6px}
    .tag{fill:#9AA7BD;font:500 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .tag b{fill:#35D07F}
    .eyebrow{fill:#35D07F;font:500 15px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px}
    .shield{fill:none;stroke:#35D07F;stroke-width:5;stroke-linejoin:round}
    .tick{fill:none;stroke:#35D07F;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw 4s ease-in-out infinite}
    .beam{fill:url(#beam);animation:sweep 4s linear infinite}
    .chip{fill:#16203a;stroke:#35D07F;stroke-width:1.5}
    .chiptxt{fill:#35D07F;font:700 20px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
    .chipsub{fill:#9AA7BD;font:500 12px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px}
    .pulse{animation:pulse 4s ease-in-out infinite;transform-origin:1105px 170px}
    .glow{fill:#35D07F;opacity:.07;animation:glow 4s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-260px)}100%{transform:translateX(1300px)}}
    @keyframes draw{0%,35%{stroke-dashoffset:60}55%,100%{stroke-dashoffset:0}}
    @keyframes pulse{0%,50%{opacity:.25;transform:scale(.96)}62%,100%{opacity:1;transform:scale(1)}}
    @keyframes glow{0%,100%{opacity:.04}50%{opacity:.12}}
  </style>
  <defs>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#35D07F" stop-opacity="0"/>
      <stop offset=".85" stop-color="#35D07F" stop-opacity=".18"/>
      <stop offset="1" stop-color="#35D07F" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="340" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect class="bg" width="1280" height="340"/>
    <g>
      <line class="grid" x1="0" y1="68" x2="1280" y2="68"/><line class="grid" x1="0" y1="136" x2="1280" y2="136"/>
      <line class="grid" x1="0" y1="204" x2="1280" y2="204"/><line class="grid" x1="0" y1="272" x2="1280" y2="272"/>
    </g>
    <text class="hex" x="18" y="40">6080604052348015600e575f5ffd5b50600436106100555760003560e01c8063a9059cbb1461005a57806370a08231146100765780</text>
    <text class="hex" x="-40" y="108">095ea7b3146100925780638da5cb5b146100ae578063f9b71797146100ca575b5f5ffd5b610074600480360381019061006f91906102</text>
    <text class="hex" x="10" y="312">a2646970667358221220c0ffee5ca1ab1e0ddba11dead10cc0de5eedfacade0f0b3c7d2e9a64736f6c634300081e0033</text>
    <rect class="beam" x="0" y="0" width="240" height="340"/>
    <circle class="glow" cx="210" cy="190" r="120"/>
    <path class="shield" d="M210 110 L268 132 L268 186 C268 222 244 248 210 262 C176 248 152 222 152 186 L152 132 Z"/>
    <path class="tick" d="M182 188 L203 208 L240 166"/>
    <text class="eyebrow" x="320" y="138">GIWA · AI RISK LAYER · ON-CHAIN</text>
    <text class="word" x="314" y="222">AEGIS</text>
    <text class="tag" x="320" y="268">A risk score on every GIWA contract — <tspan fill="#35D07F">before you sign.</tspan></text>
    <g class="pulse">
      <rect class="chip" x="1010" y="130" width="190" height="80" rx="14"/>
      <text class="chiptxt" x="1105" y="168" text-anchor="middle">8/100</text>
      <text class="chipsub" x="1105" y="194" text-anchor="middle">LOW RISK</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
